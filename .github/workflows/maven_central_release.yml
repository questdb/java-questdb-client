name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to publish, for example 1.2.1
        required: true
        type: string
      next_development_version:
        description: Next development version, for example 1.2.2-SNAPSHOT
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-release
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MAVEN_RELEASE_AWS_REGION: ${{ vars.MAVEN_RELEASE_AWS_REGION }}
      MAVEN_RELEASE_AWS_ROLE_ARN: ${{ secrets.MAVEN_RELEASE_AWS_ROLE_ARN }}
      MAVEN_RELEASE_AWS_SECRET_ARN: ${{ secrets.MAVEN_RELEASE_AWS_SECRET_ARN }}
    steps:
      - name: Validate workflow configuration
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Run this workflow from ${DEFAULT_BRANCH}."
            exit 1
          fi

          if [[ "${{ inputs.release_version }}" == *-SNAPSHOT ]]; then
            echo "::error::release-version must not end with -SNAPSHOT."
            exit 1
          fi

          if [[ "${{ inputs.next_development_version }}" != *-SNAPSHOT ]]; then
            echo "::error::next-development-version must end with -SNAPSHOT."
            exit 1
          fi

          required_vars=(
            MAVEN_RELEASE_AWS_REGION
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "::error::Repository variable ${var_name} is required."
              exit 1
            fi
          done

          required_secrets=(
            MAVEN_RELEASE_AWS_ROLE_ARN
            MAVEN_RELEASE_AWS_SECRET_ARN
          )

          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::GitHub secret ${secret_name} is required."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAVEN_RELEASE_GIT_TOKEN || github.token }}

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.MAVEN_RELEASE_AWS_REGION }}
          role-to-assume: ${{ env.MAVEN_RELEASE_AWS_ROLE_ARN }}
          role-session-name: java-questdb-client-release

      - name: Fetch release credentials
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,${{ env.MAVEN_RELEASE_AWS_SECRET_ARN }}
          parse-json-secrets: true

      - name: Validate release credentials
        run: |
          required_vars=(
            MAVEN_GPG_PRIVATE_KEY
            MAVEN_GPG_PASSPHRASE
            MAVEN_CENTRAL_USERNAME
            MAVEN_CENTRAL_PASSWORD
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "::error::AWS secret ${MAVEN_RELEASE_AWS_SECRET_ARN} must define ${var_name}."
              exit 1
            fi
          done

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure Maven settings.xml
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_PASSWORD}</password>
              </server>
              <server>
                <id>gpg.passphrase</id>
                <passphrase>${env.MAVEN_GPG_PASSPHRASE}</passphrase>
              </server>
            </servers>
          </settings>
          EOF

      - name: Import release signing key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Prepare and publish release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}
        run: |
          mvn -B -ntp \
            release:clean release:prepare release:perform \
            -DautoVersionSubmodules=true \
            -DpushChanges=false \
            -DlocalCheckout=true \
            -DreleaseVersion="${RELEASE_VERSION}" \
            -DdevelopmentVersion="${NEXT_DEVELOPMENT_VERSION}" \
            -Dtag="${RELEASE_VERSION}"

      - name: Push release commits and tag
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin --tags

      - name: Remove imported signing key
        if: always()
        run: |
          if [[ -n "${GNUPGHOME:-}" && -d "${GNUPGHOME}" ]]; then
            rm -rf "$GNUPGHOME"
          fi
